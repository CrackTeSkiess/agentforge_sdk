# This workflow uploads a Python Package to TestPyPI on every push to main
# This allows testing the package before creating an official release

name: Upload Python Package to TestPyPI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Check distribution
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: test-release-dists
          path: dist/

  testpypi-publish:
    runs-on: ubuntu-latest
    needs:
      - test-build
    permissions:
      id-token: write

    environment:
      name: testpypi
      url: https://test.pypi.org/p/aitabletop_sdk

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: test-release-dists
          path: dist/

      - name: Publish release distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
