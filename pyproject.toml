[build-system]
requires = ["setuptools>=45,<70", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "AgentForge Python SDK - Build and deploy RL agents for competitive multiplayer games"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "AgentForge Team", email = "support@agentforge.com"}
]
keywords = ["reinforcement-learning", "rl", "games", "competition", "agents", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "websockets>=13.0,<15.0",
]

[project.optional-dependencies]
chess = ["chess>=1.10.0,<2.0.0"]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.0,<2.0",
    "chess>=1.10.0,<2.0.0",
]
security = [
    "bandit>=1.7.0",
    "safety>=3.0.0",
]

[project.urls]
Homepage = "https://agentforge.com"
Documentation = "https://docs.agentforge.com"
Repository = "https://github.com/agentforge/agentforge"
Issues = "https://github.com/agentforge/agentforge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge*"]
exclude = ["tests*", "*test*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["agentforge"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true