[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aitabletop"
version = "0.1.0"
description = "AITabletop Python SDK - Build and deploy AI agents for tabletop games"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "AITabletop Team", email = "support@aitabletop.com"}
]
maintainers = [
    {name = "AITabletop Team", email = "support@aitabletop.com"}
]
keywords = [
    "reinforcement-learning",
    "rl",
    "games",
    "competition",
    "agents",
    "ai",
    "chess",
    "multiplayer",
    "bot",
    "tabletop",
    "board-games",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "websockets>=13.0,<15.0",
]

[project.optional-dependencies]
chess = ["chess>=1.10.0,<2.0.0"]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.0,<2.0",
    "chess>=1.10.0,<2.0.0",
]
security = [
    "bandit>=1.7.0",
    "safety>=3.0.0",
]

[project.urls]
Homepage = "https://aitabletop.com"
Documentation = "https://docs.aitabletop.com"
Repository = "https://github.com/aitabletop/aitabletop-sdk.git"
Issues = "https://github.com/aitabletop/aitabletop-sdk/issues"
Changelog = "https://github.com/aitabletop/aitabletop-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["aitabletop*"]
exclude = ["tests*", "*test*", "main.py"]

[tool.setuptools.package-data]
aitabletop = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["aitabletop"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["aitabletop"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
